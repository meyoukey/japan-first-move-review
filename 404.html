<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Page not found | Japan First Move</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <style>
      :root {
        color: #171717;
        background: #eef8fb;
        font-family: Avenir, "Avenir Next", "Trebuchet MS", "Hiragino Maru Gothic ProN", Verdana, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          linear-gradient(180deg, #ffffff 0 72px, transparent 72px),
          #eef8fb;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .site-header {
        display: flex;
        align-items: center;
        min-height: 72px;
        padding: 0.65rem clamp(1rem, 3vw, 2rem);
        border-bottom: 3px solid #efd8e1;
        background: #ffffff;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.7rem;
      }

      .brand img {
        width: 38px;
        height: 44px;
      }

      .brand-copy strong,
      .brand-copy small {
        display: block;
      }

      .brand-copy strong {
        font-size: 1rem;
        font-weight: 900;
        line-height: 1;
      }

      .brand-copy small {
        margin-top: 0.18rem;
        color: #5d6066;
        font-size: 0.72rem;
        font-weight: 700;
      }

      main {
        display: grid;
        min-height: calc(100vh - 72px);
        place-items: center;
        padding: clamp(2rem, 7vw, 5rem) 1.25rem;
      }

      .not-found {
        width: min(100%, 680px);
        padding: clamp(2rem, 6vw, 4rem);
        border-left: 6px solid #d9aabd;
        background: #ffffff;
        box-shadow: 0 18px 44px rgba(16, 40, 79, 0.1);
      }

      .error-code {
        margin: 0 0 0.35rem;
        color: #9b5f78;
        font-size: 0.78rem;
        font-weight: 900;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: #10284f;
        font-size: clamp(2rem, 7vw, 4rem);
        line-height: 1.05;
      }

      .message {
        max-width: 34rem;
        margin: 1rem 0 1.6rem;
        color: #5d6066;
        font-size: clamp(0.95rem, 2vw, 1.08rem);
      }

      .home-link {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        padding: 0.7rem 1.1rem;
        color: #ffffff;
        background: #10284f;
        font-weight: 850;
      }

      .home-link:hover,
      .home-link:focus-visible {
        background: #264a78;
        outline: 3px solid #b9dbea;
        outline-offset: 3px;
      }

      @media (max-width: 520px) {
        .not-found {
          padding: 1.8rem 1.4rem;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Japan First Move home">
        <img src="/assets/ui/SVG/logo.svg" alt="" />
        <span class="brand-copy">
          <strong>Japan First Move</strong>
          <small>Your first step in Japan</small>
        </span>
      </a>
    </header>

    <main>
      <section class="not-found" aria-labelledby="page-title">
        <p class="error-code">404 error</p>
        <h1 id="page-title">Page not found</h1>
        <p class="message">The page may have moved, or the URL may be incorrect.</p>
        <a class="home-link" href="/">Go to homepage</a>
      </section>
    </main>
  </body>
</html>
